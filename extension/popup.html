<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to memlio</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --accent: #d97706;
        --accent-fg: #ffffff;
        --ok: #047857;
        --error: #b91c1c;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --border: #1e293b;
          --accent: #fbbf24;
          --accent-fg: #020617;
          --ok: #34d399;
          --error: #f87171;
        }
      }
      body {
        margin: 0;
        width: 340px;
        padding: 14px 16px 12px;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #title {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #url {
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 10px;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 64px;
        resize: vertical;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 8px 0 10px;
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      button {
        padding: 6px 14px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: var(--accent-fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      kbd {
        color: var(--muted);
        font-size: 11px;
      }
      #status {
        margin-top: 10px;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 1.4em;
      }
      #status.ok {
        color: var(--ok);
      }
      #status.error {
        color: var(--error);
      }
      #footer {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div id="title"></div>
    <div id="url"></div>
    <textarea id="note" placeholder="Why does this matter? (optional)" autofocus></textarea>
    <label><input type="checkbox" id="screenshot" /> Attach a screenshot of the visible area</label>
    <div class="row">
      <button id="save">Save</button>
      <kbd>⌘/Ctrl + Enter</kbd>
    </div>
    <div id="status"></div>
    <div id="footer">Connecting to memlio…</div>
    <script src="popup.js"></script>
  </body>
</html>
