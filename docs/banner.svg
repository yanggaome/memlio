<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Memlio</title>
  <desc id="d">Save a bookmark, note, or screenshot from Claude Code or Codex, then find it later by describing what you remember.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="420" rx="24"/></clipPath>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <circle cx="1080" cy="60" r="220" fill="#f97316" opacity="0.06"/>
    <circle cx="120" cy="400" r="160" fill="#38bdf8" opacity="0.06"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(72 72)">
    <rect x="0" y="0" width="44" height="44" rx="11" fill="url(#glow)"/>
    <path d="M12 30 V14 l6 8 6-8 v16" fill="none" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="35" font-size="38" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">memlio</text>
    <text x="60" y="62" font-size="15" fill="#94a3b8">personal memory for Claude Code and Codex</text>
  </g>

  <!-- headline -->
  <text x="72" y="196" font-size="36" font-weight="700" fill="#f8fafc" letter-spacing="-0.6">Save it now. Find it later</text>
  <text x="72" y="240" font-size="36" font-weight="700" fill="#fbbf24" letter-spacing="-0.6">from a vague description.</text>

  <!-- feature bullets -->
  <g font-size="16" fill="#cbd5e1">
    <g transform="translate(72 292)">
      <circle cx="6" cy="-5" r="4" fill="#38bdf8"/><text x="20" y="0">Bookmarks, notes, files, and pasted screenshots</text>
    </g>
    <g transform="translate(72 322)">
      <circle cx="6" cy="-5" r="4" fill="#38bdf8"/><text x="20" y="0">Local SQLite, local embeddings, no accounts or API keys</text>
    </g>
    <g transform="translate(72 352)">
      <circle cx="6" cy="-5" r="4" fill="#38bdf8"/><text x="20" y="0">Shared across every project and session</text>
    </g>
  </g>

  <!-- terminal card -->
  <g transform="translate(640 84)" filter="url(#shadow)">
    <rect width="500" height="262" rx="14" fill="#020617" stroke="#334155"/>
    <circle cx="22" cy="20" r="5" fill="#ef4444"/>
    <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="58" cy="20" r="5" fill="#22c55e"/>
    <g class="mono" font-size="13">
      <text x="24" y="58" fill="#64748b">› </text>
      <text x="40" y="58" fill="#fbbf24">/memlio</text>
      <text x="104" y="58" fill="#e2e8f0">https://example.com/queues  queue project</text>
      <text x="24" y="82" fill="#34d399">Saved m_7f3a  Background jobs done right</text>

      <text x="24" y="122" fill="#64748b">› </text>
      <text x="40" y="122" fill="#fbbf24">/memlio</text>
      <text x="104" y="122" fill="#e2e8f0">[pasted screenshot]  competitor pricing</text>
      <text x="24" y="146" fill="#34d399">Saved m_9c21  Pasted image 2026-09-11 14:02</text>

      <text x="24" y="186" fill="#64748b">› </text>
      <text x="40" y="186" fill="#fbbf24">/memlio find</text>
      <text x="140" y="186" fill="#e2e8f0">that dark dashboard with orange charts</text>
      <text x="24" y="210" fill="#34d399">m_9c21  Pasted image 2026-09-11 14:02</text>
      <text x="24" y="232" fill="#94a3b8">        semantic similarity 0.81 · assets/9c21….png</text>
    </g>
  </g>
</svg>
